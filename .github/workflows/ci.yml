name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run test suite
        # Template-button adopters may delete tests/; CI stays green with a note instead of failing.
        run: |
          if [ -d tests ]; then
            python3 -m unittest discover -s tests
          else
            echo "tests/ not kept — nothing to run."
          fi
